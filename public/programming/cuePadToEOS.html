<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuePad to EOS Converter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            color: #222;
        }
        p {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 20px;
        }
        .file-upload {
            margin: 20px 0;
        }
        input[type="file"] {
            display: block;
            margin: 0 auto;
            padding: 10px;
            border: 2px dashed #ccc;
            border-radius: 6px;
            width: 90%;
            cursor: pointer;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #004494;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .error { color: #d9534f; }
        .success { color: #5cb85c; }
    </style>
</head>
<body>

    <div class="container">
        <h1>CuePad to EOS CSV</h1>
        <p>Upload your CuePad CSV export to convert it into an ETC EOS compatible target list.</p>
        
        <div class="file-upload">
            <input type="file" id="csvFile" accept=".csv" />
        </div>
        <button id="convertBtn" disabled>Convert & Download</button>
        <div id="status"></div>
    </div>

    <script>
        const fileInput = document.getElementById('csvFile');
        const convertBtn = document.getElementById('convertBtn');
        const statusDiv = document.getElementById('status');

        // Enable button when file is selected
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                convertBtn.disabled = false;
                statusDiv.textContent = "";
            } else {
                convertBtn.disabled = true;
            }
        });

        convertBtn.addEventListener('click', () => {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const text = e.target.result;
                    const parsedData = parseCSV(text);
                    
                    if (parsedData.length < 2) {
                        throw new Error("CSV file seems to be empty or invalid.");
                    }

                    // Normalize headers for safety
                    const headers = parsedData[0].map(h => h.trim().toLowerCase());
                    const cueNumIdx = headers.indexOf('cue number');
                    const cueTrigIdx = headers.indexOf('cue trigger');
                    const cueTextIdx = headers.indexOf('cue text');

                    if (cueNumIdx === -1) throw new Error("Could not find column 'Cue Number'");
                    if (cueTrigIdx === -1) throw new Error("Could not find column 'Cue Trigger'");
                    if (cueTextIdx === -1) throw new Error("Could not find column 'Cue Text'");

                    let eosCSV = "START_TARGETS,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,\n";
                    eosCSV += "TARGET_TYPE,TARGET_TYPE_AS_TEXT,TARGET_LIST_NUMBER,TARGET_ID,TARGET_DCID,PART_NUMBER,LABEL,TIME_DATA,UP_DELAY,DOWN_TIME,DOWN_DELAY,FOCUS_TIME,FOCUS_DELAY,COLOR_TIME,COLOR_DELAY,BEAM_TIME,BEAM_DELAY,DURATION,ALERT_TIME,MARK,BLOCK,ASSERT,ALL_FADE,PREHEAT,FOLLOW,LINK,LOOP,CURVE,RATE,EXTERNAL_LINKS,EFFECTS,MODE,CUE_NOTES,SCENE_TEXT,SCENE_END,WIDTH,HEIGHT\n";
                    eosCSV += "15,Cue_List,,1,,,Cue List Name,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,\n";

                    // Process cues
                    for (let i = 1; i < parsedData.length; i++) {
                        const row = parsedData[i];
                        
                        // Skip completely empty rows that might happen at EOF
                        if (row.length === 1 && row[0].trim() === '') continue;
                        
                        // Grab cell values and default to empty string if out of bounds
                        const rawCueNum = row[cueNumIdx] || "";
                        const rawCueTrig = row[cueTrigIdx] || "";
                        const rawCueText = row[cueTextIdx] || "";

                        // Clean the data based on requirements
                        const cueNum = rawCueNum.replace(/[^0-9.]/g, '');
                        const cueTrig = rawCueTrig.replace(/[\r\n]/g, ' ').replace(/,/g, '').trim();
                        const cueText = rawCueText.replace(/[\r\n]/g, ' ').replace(/,/g, '').trim();

                        // Skip rows where Cue Number didn't extract properly (e.g., blank lines)
                        if (!cueNum) continue;

                        eosCSV += `1,Cue,1,${cueNum},,,${cueTrig},1,,,,,,,,,,1,,,,,,,,,,,,,,,${cueText},,,,\n`;
                    }

                    eosCSV += "END_TARGETS,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,";

                    downloadFile(file.name, eosCSV);
                    
                    statusDiv.className = "success";
                    statusDiv.textContent = "Successfully converted and downloaded!";
                } catch (err) {
                    statusDiv.className = "error";
                    statusDiv.textContent = err.message;
                }
            };

            reader.readAsText(file);
        });

        // A robust CSV parser that correctly handles newlines and commas embedded inside double quotes
        function parseCSV(text) {
            let result = [];
            let row = [];
            let cell = '';
            let inQuotes = false;
            
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let nextChar = text[i + 1];

                if (char === '"' && nextChar === '"' && inQuotes) {
                    // Escaped quote
                    cell += '"';
                    i++;
                } else if (char === '"') {
                    // Toggle quote state
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    // End of cell
                    row.push(cell);
                    cell = '';
                } else if ((char === '\n' || char === '\r') && !inQuotes) {
                    // End of row
                    if (char === '\r' && nextChar === '\n') {
                        i++; // Handle Windows CRLF
                    }
                    row.push(cell);
                    result.push(row);
                    row = [];
                    cell = '';
                } else {
                    cell += char;
                }
            }
            // Push final row/cell if file doesn't end with a newline
            if (cell !== '' || row.length > 0) {
                row.push(cell);
                result.push(row);
            }
            return result;
        }

        // Trigger the browser file download
        function downloadFile(originalName, content) {
            const newName = originalName.replace(/\.[^/.]+$/, "") + "-EOS.csv";
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.href = url;
            link.download = newName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
